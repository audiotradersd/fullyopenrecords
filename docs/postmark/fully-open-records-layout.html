<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="x-apple-disable-message-reformatting">
    <title>Fully Open Records</title>
    <style>
      @media only screen and (max-width: 620px) {
        .email-shell { width: 100% !important; }
        .email-content { padding: 32px 24px !important; }
        .email-footer { padding-left: 24px !important; padding-right: 24px !important; }
        .email-logo { width: 210px !important; height: auto !important; }
      }
    </style>
  </head>
  <body style="margin:0; padding:0; background-color:#080310; color:#f4eef7; font-family:Arial, Helvetica, sans-serif;">
    <div role="article" aria-roledescription="email" lang="en" style="background-color:#080310;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#080310;">
        <tr>
          <td align="center" style="padding:32px 16px;">
            <table class="email-shell" role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:600px; overflow:hidden; border:1px solid #39214d; border-radius:20px; background-color:#100719;">
              <tr>
                <td align="center" style="padding:34px 40px 28px; background-color:#13081f; background-image:linear-gradient(135deg, #1e0d3a 0%, #3a1b5c 48%, #a12c6a 100%);">
                  <a href="https://fullyopenrecords.com" style="text-decoration:none;" target="_blank">
                    <img class="email-logo" src="https://fullyopenrecords.com/new-logo-v2.png" width="250" alt="Fully Open Records" style="display:block; width:250px; height:auto; border:0; outline:none; text-decoration:none;">
                  </a>
                </td>
              </tr>
              <tr>
                <td class="email-content" style="padding:42px 48px 40px; background-color:#100719; color:#e9deec; font-family:Arial, Helvetica, sans-serif; font-size:16px; line-height:1.65;">
                  {{{ @content }}}
                </td>
              </tr>
              <tr>
                <td class="email-footer" style="padding:26px 48px 32px; border-top:1px solid #39214d; background-color:#0b0411; color:#c9b6d9; font-family:Arial, Helvetica, sans-serif; font-size:12px; line-height:1.6; text-align:center;">
                  <p style="margin:0 0 8px;">Music Without Algorithms.</p>
                  <p style="margin:0;">
                    <a href="https://fullyopenrecords.com" style="color:#e36a9c; text-decoration:underline;" target="_blank">fullyopenrecords.com</a>
                  </p>
                </td>
              </tr>
            </table>
            <p style="margin:18px 0 0; color:#8e7898; font-family:Arial, Helvetica, sans-serif; font-size:11px; line-height:1.5; text-align:center;">
              Sent by Fully Open Records. Please do not reply to this email.
            </p>
          </td>
        </tr>
      </table>
    </div>
  </body>
</html>
